<div class="categories-container">
  <div class="categories-header">
    <h2>Categories — {{ norm }}</h2>
  </div>

  <div *ngIf="loading" class="loading-text">Loading...</div>
  <div *ngIf="error" class="error-text">{{ error }}</div>

  <div *ngIf="!loading && !error" class="search-bar">
    <input
      type="text"
      placeholder="Search a category..."
      [(ngModel)]="searchTerm"
      (ngModelChange)="onSearch()"
    />
  </div>

  <ul *ngIf="!loading && !error" class="categories-list">
    <li *ngFor="let cat of filteredCategories">
      <label>
        <input
          type="checkbox"
          [checked]="cat.checked"
          (change)="toggleCheck(cat)"
        />
        <span>{{ cat.category_name }}</span>
      </label>
    </li>
  </ul>
</div>
